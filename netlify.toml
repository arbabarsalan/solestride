[build]
  command = "npm run build --prefix client && cp public/assets/*.jpg client/dist/assets/"
  publish = "client/dist"
  functions = "netlify/functions"

# Everything under /api goes to the single Express-backed function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for the React client.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
