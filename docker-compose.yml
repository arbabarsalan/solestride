# LIBAS dev stack: Postgres 16 plus the api server. The client runs on the
# host with `npm run dev` (its Vite proxy already points at localhost:5000).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: libas
      POSTGRES_PASSWORD: libas
      POSTGRES_DB: libas
    ports:
      - "5432:5432"
    volumes:
      - libas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libas -d libas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://libas:libas@db:5432/libas
      JWT_SECRET: change-me
      # Stripe TEST keys only; leave empty and COD checkout still works.
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  libas_pgdata:
